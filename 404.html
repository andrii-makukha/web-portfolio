<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="robots" content="noindex,follow">
  <meta name="color-scheme" content="dark">
  <title>404 — Andrii Makukha</title>
  <link rel="icon" href="https://andrii-makukha.github.io/web-portfolio/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://andrii-makukha.github.io/web-portfolio/css/v2.css">
  <link rel="stylesheet" href="https://andrii-makukha.github.io/web-portfolio/css/legal.css">
</head>
<body class="error-page">
  <nav class="legal-nav" aria-label="Seitennavigation">
    <a class="legal-nav__mark" href="https://andrii-makukha.github.io/web-portfolio/de/" aria-label="Zur Startseite von Andrii Makukha">AM</a>
    <div class="legal-nav__links" aria-label="Sprache wählen">
      <a href="https://andrii-makukha.github.io/web-portfolio/de/" hreflang="de" lang="de">DE</a>
      <a href="https://andrii-makukha.github.io/web-portfolio/en/" hreflang="en" lang="en">EN</a>
      <a href="https://andrii-makukha.github.io/web-portfolio/ru/" hreflang="ru" lang="ru">RU</a>
    </div>
  </nav>

  <main class="error-shell">
    <p class="error-eyebrow">Error / 404</p>
    <div class="error-code" aria-hidden="true">404</div>
    <div class="error-content">
      <div>
        <h1 class="legal-title">Seite nicht gefunden.</h1>
        <p class="error-lead">Die angeforderte Seite existiert nicht oder wurde verschoben. Wählen Sie eine Portfolio-Version und setzen Sie Ihre Reise dort fort.</p>
      </div>
      <div class="error-actions" aria-label="Portfolio-Versionen">
        <a href="https://andrii-makukha.github.io/web-portfolio/de/"><span>Deutsch</span><span>DE ↗</span></a>
        <a href="https://andrii-makukha.github.io/web-portfolio/en/"><span>English</span><span>EN ↗</span></a>
        <a href="https://andrii-makukha.github.io/web-portfolio/ru/"><span>Русский</span><span>RU ↗</span></a>
      </div>
    </div>
  </main>
</body>
</html>
