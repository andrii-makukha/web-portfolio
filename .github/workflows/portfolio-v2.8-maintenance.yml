name: Portfolio v2.8 Maintenance

on:
  push:
    branches:
      - portfolio-v2.8-final-audit
    paths:
      - ".github/workflows/portfolio-v2.8-maintenance.yml"
      - "css/v2.css"
      - "scripts/build_cv_v3.py"
      - "assets/cv/*.pdf"

permissions:
  contents: write

jobs:
  apply-audit-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2.8-final-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CV build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils
          python -m pip install --upgrade pip
          python -m pip install reportlab==5.0.1 Pillow pillow-avif-plugin

      - name: Apply v2.8 source corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          cv = Path('scripts/build_cv_v3.py')
          text = cv.read_text()
          old = '"portfolio": "andrii-makukha.github.io/web-portfolio/",'
          new = '"portfolio": "web-portfolio-woad-two.vercel.app/",'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('CV portfolio URL contract not found')
          cv.write_text(text)

          css = Path('css/v2.css')
          text = css.read_text()
          marker = '/* v2.8 footer information architecture */'
          if marker not in text:
              raise SystemExit('v2.8 footer block is missing')

          text = text.replace(
              'color: rgba(250, 248, 243, .46);',
              'color: rgba(250, 248, 243, .50);',
          )

          mobile_marker = '/* v2.8 mobile footer refinement */'
          if mobile_marker not in text:
              text += dedent(r'''

              /* v2.8 mobile footer refinement */
              @media (max-width: 560px) {
                .contact__footer {
                  grid-template-areas:
                    "copyright top"
                    "transparency transparency"
                    "legal legal";
                row-gap: .2rem;
              }

                .contact__footer > span:nth-child(1),
                .contact__footer > span:nth-child(2) {
                  max-width: none;
                }

                .contact__footer > span:nth-child(2) {
                  white-space: normal;
                }
              }
              ''')

          css.write_text(text)
          PY

      - name: Rebuild production CV PDFs
        run: python scripts/build_cv.py

      - name: Verify refreshed CVs
        run: |
          for file in assets/cv/*.pdf; do
            test "$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')" = "1"
            text="/tmp/$(basename "$file" .pdf).txt"
            pdftotext -layout "$file" "$text"
            grep -q "ANDRII MAKUKHA" "$text"
            grep -q "web-portfolio-woad-two.vercel.app/" "$text"
            ! grep -q "andrii-makukha.github.io/web-portfolio/" "$text"
            ! grep -q "�" "$text"
          done

      - name: Commit generated audit fixes when needed
        run: |
          if git diff --quiet -- css/v2.css scripts/build_cv_v3.py assets/cv; then
            echo "No maintenance changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v2.css scripts/build_cv_v3.py assets/cv/*.pdf
          git commit -m "Refine v2.8 mobile footer layout"
          git push origin HEAD:portfolio-v2.8-final-audit
