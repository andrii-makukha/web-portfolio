name: Responsive Hardening Bootstrap

on:
  push:
    branches:
      - portfolio-v2.1-responsive-hardening
    paths:
      - ".github/workflows/responsive-hardening-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2.1-responsive-hardening
      - name: Apply responsive hardening
        run: python3 qa/apply-responsive-hardening-v21.py
      - name: Commit responsive hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v2.css qa/browser-qa.mjs qa/README.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix: cap fluid layout growth on wide screens"
          git push origin HEAD:portfolio-v2.1-responsive-hardening
