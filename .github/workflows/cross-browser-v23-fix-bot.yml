name: Apply v2.3 Cross-Browser Fixes

on:
  push:
    branches:
      - portfolio-v2.3-cross-browser-stress
    paths:
      - ".github/workflows/cross-browser-v23-fix-bot.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2.3-cross-browser-stress

      - name: Calibrate permanent cross-browser gate
        run: python3 qa/apply-cross-browser-v23.py

      - name: Validate QA syntax
        run: node --check qa/cross-browser-v2.mjs

      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/cross-browser-v2.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "QA: calibrate Firefox cross-browser gate"
          git push origin HEAD:portfolio-v2.3-cross-browser-stress
