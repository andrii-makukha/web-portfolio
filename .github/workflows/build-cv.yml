name: Build Portfolio CV PDFs

# Permanent read-only release gate: rebuild committed CVs from source and compare
# multilingual ATS text plus 200-dpi rendered output; CV v3 also verifies the shared portrait asset.
on:
  workflow_dispatch:
  push:
    branches:
      - portfolio-v2
      - cv-v3-professional-redesign
      - main
    paths:
      - "assets/cv/*.pdf"
      - "assets/portrait.avif"
      - "scripts/build_cv.py"
      - "scripts/build_cv_v3.py"
      - "docs/CV_V3_DESIGN.md"
      - "docs/CV_V3_QA.md"
      - ".github/workflows/build-cv.yml"

permissions:
  contents: read

jobs:
  build-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Snapshot committed CV PDFs
        run: |
          mkdir -p /tmp/cv-reference
          cp assets/cv/*.pdf /tmp/cv-reference/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils
          python -m pip install --upgrade pip
          python -m pip install reportlab==5.0.1 Pillow pillow-avif-plugin

      - name: Rebuild CV PDFs from source
        run: python scripts/build_cv.py

      - name: Verify reproducibility, ATS text and visual output
        run: |
          mkdir -p cv-qa/generated cv-qa/reference
          for file in assets/cv/*.pdf; do
            name="$(basename "$file" .pdf)"
            reference="/tmp/cv-reference/$name.pdf"

            test -f "$reference"
            test "$(pdfinfo "$file" | awk '/^Pages:/ {print $2}')" = "1"
            test "$(pdfinfo "$reference" | awk '/^Pages:/ {print $2}')" = "1"

            pdftotext -layout "$file" "cv-qa/generated/$name.txt"
            pdftotext -layout "$reference" "cv-qa/reference/$name.txt"
            grep -q "ANDRII MAKUKHA" "cv-qa/generated/$name.txt"
            grep -q "Hardy Orchestra" "cv-qa/generated/$name.txt"
            grep -q "Symbioz Band" "cv-qa/generated/$name.txt"
            grep -q "ReSchuhe" "cv-qa/generated/$name.txt"
            grep -q "Hillel IT School" "cv-qa/generated/$name.txt"
            ! grep -q "�" "cv-qa/generated/$name.txt"
            cmp "cv-qa/generated/$name.txt" "cv-qa/reference/$name.txt"

            pdftoppm -png -singlefile -r 200 "$file" "cv-qa/generated/$name"
            pdftoppm -png -singlefile -r 200 "$reference" "cv-qa/reference/$name"
            cmp "cv-qa/generated/$name.png" "cv-qa/reference/$name.png"
          done

          grep -q "BERUFSERFAHRUNG" cv-qa/generated/andrii-makukha-de.txt
          grep -q "PROFESSIONAL EXPERIENCE" cv-qa/generated/andrii-makukha-en.txt
          grep -q "ПРОФЕССИОНАЛЬНЫЙ ОПЫТ" cv-qa/generated/andrii-makukha-ru.txt

      - name: Upload CV QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-cv-qa
          path: |
            cv-qa/
            assets/cv/*.pdf
          if-no-files-found: error
          retention-days: 14
