name: One-off final release polish

on:
  push:
    branches: [portfolio-v2]
    paths: [".github/workflows/one-off-final-release-polish.yml"]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2
          fetch-depth: 0
      - name: Install CV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils
          python -m pip install reportlab==5.0.1
      - name: Apply final polish
        run: |
          python scripts/final_release_polish.py
          git checkout -- .github/workflows/build-cv.yml
      - name: Regenerate and verify CVs
        run: |
          python scripts/build_cv.py
          for f in assets/cv/*.pdf; do
            test "$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')" = "1"
            pdftotext "$f" - | grep -q "ANDRII MAKUKHA"
          done
      - name: Commit polished release candidate
        run: |
          rm scripts/final_release_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final portfolio release polish"
          git push origin HEAD:portfolio-v2
