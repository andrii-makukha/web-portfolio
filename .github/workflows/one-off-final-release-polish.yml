name: One-off final release polish

on:
  push:
    branches: [portfolio-v2]
    paths: [".github/workflows/one-off-final-release-polish.yml"]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2
          fetch-depth: 0
      - name: Install CV dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils
          python -m pip install reportlab==5.0.1
      - name: Apply final polish
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new, n=None):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c == 0 or (n is not None and c != n):
                  raise SystemExit(f"{path}: expected {n or '>=1'} x {old!r}, found {c}")
              p.write_text(s.replace(old,new))

          oldns='<noscript><style>[data-reveal]{opacity:1!important;transform:none!important}.portrait-frame{clip-path:none!important;opacity:1!important}.workflow-step,.journey-event{opacity:1!important;transform:none!important}</style></noscript>'
          newns='<noscript><style>[data-reveal]{opacity:1!important;transform:none!important}.portrait-frame{clip-path:none!important;opacity:1!important}.workflow-step,.journey-event{opacity:1!important;transform:none!important}.opening__name,.opening__eyebrow,.opening__meta,.opening__scroll{opacity:1!important;transform:none!important}.site-nav__menu-toggle{display:none!important}.site-nav__languages{display:flex!important}</style></noscript>'
          for lang in ('de','en','ru'):
              p=f'{lang}/index.html'
              rep(p,'class="text-link text-link--quiet" href="../assets/cv/','class="text-link" href="../assets/cv/',1)
              rep(p,oldns,newns,1)
              rep(p,'<meta name="twitter:card" content="summary">','<meta name="twitter:card" content="summary_large_image">',1)
              rep(p,'<link rel="stylesheet" href="../css/v2.css">','<link rel="stylesheet" href="../css/v2.css">\n  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">',1)
          rep('en/index.html','<meta property="og:locale" content="en_US">','<meta property="og:locale" content="en_GB">',1)

          for a,b in {
              '<dt>OPERATIONS</dt>':'<dt>ORGANISATION</dt>',
              '<dt>BUSINESS</dt>':'<dt>GESCHÄFT</dt>',
              '<dt>LEADERSHIP</dt>':'<dt>FÜHRUNG</dt>',
              '<dt>QUALITY</dt>':'<dt>QUALITÄT</dt>',
              '<dt>ROLE</dt>':'<dt>ROLLE</dt>',
              '<dt>CONTEXT</dt>':'<dt>KONTEXT</dt>',
              '<dt>PRESSURE</dt>':'<dt>BELASTUNG</dt>',
              '<div><span>DESIGN</span><strong>Art Direction · Layout · Motion</strong></div>':'<div><span>GESTALTUNG</span><strong>Gestaltung · Layout · Animation</strong></div>',
              'E-Mail-Benachrichtigungen und Rate Limiting.':'E-Mail-Benachrichtigungen und Begrenzung der Anfragefrequenz.',
              'Routing und State Management.':'Routing und Zustandsverwaltung.',
              'Live-Druck':'Druck bei Live-Auftritten'
          }.items(): rep('de/index.html',a,b)
          rep('ru/index.html','<span>SYSTEM</span>','<span>СИСТЕМА</span>',1)
          rep('ru/index.html','основы frontend/backend','основы фронтенда и бэкенда',1)
          rep('index.html','<title>Andrii Makukha — Portfolio</title>','<title>Andrii Makukha — Portfolio</title>\n  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">',1)

          rep('README.md','The CVs are generated reproducibly from `scripts/build_cv.py`. The CV workflow verifies one-page output and extractable ATS text, then creates PNG/text QA artifacts before generated PDFs are committed.','The CVs are generated from `scripts/build_cv.py`. The CV workflow rebuilds them in CI, verifies one-page output, compares ATS text and rendered PNGs against the committed PDFs, and uploads QA artifacts. It does not modify the repository.',1)
          rep('.github/workflows/build-cv.yml','python -m pip install reportlab\n','python -m pip install reportlab==5.0.1\n',1)
          rep('scripts/build_cv.py','Präzision und Belastbarkeit unter Live-Druck.','Präzision und Belastbarkeit unter dem Druck von Live-Auftritten.',1)
          rep('scripts/build_cv.py','("Digital & Lernen", "Web-Grundlagen · digitale Recherche · KI-gestützte Workflows")','("Digitales Arbeiten & Lernen", "Web-Grundlagen · digitale Recherche · KI-gestützte Workflows")',1)

          Path('assets/favicon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="13" fill="#111D2D"/><rect x="8" y="8" width="3" height="48" rx="1.5" fill="#A67B4B"/><path d="M20 45 29.5 19h5L44 45h-5.2l-2.1-6.5H27.2L25.1 45H20Zm8.7-11h6.5l-3.25-10-3.25 10Z" fill="#FAF8F3"/><path d="M46 19h4v26h-4z" fill="#FAF8F3"/></svg>')

          q=Path('qa/browser-qa.mjs'); s=q.read_text(); marker='/* === CV release gate === */'
          if '/* === No-JavaScript release gate === */' in s: raise SystemExit('QA gates already present')
          block=r'''/* === No-JavaScript release gate === */
{
  const scope="release/no-javascript", checks=[];
  for(const locale of locales){
    const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,javaScriptEnabled:false});
    const page=await context.newPage();
    const response=await page.goto(`${ORIGIN}/${locale}/`,{waitUntil:"load",timeout:30000});
    const state=await page.evaluate(()=>{
      const opening=[".opening__name",".opening__eyebrow",".opening__meta",".opening__scroll"].map(selector=>{const el=document.querySelector(selector),style=el?getComputedStyle(el):null;return{selector,exists:Boolean(el),opacity:style?Number(style.opacity):null,transform:style?.transform||null}});
      const toggle=document.querySelector(".site-nav__menu-toggle"),langs=document.querySelector(".site-nav__languages");
      return{opening,menuToggleDisplay:toggle?getComputedStyle(toggle).display:null,languagesDisplay:langs?getComputedStyle(langs).display:null,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,mainTextLength:(document.querySelector("#main-content")?.textContent||"").trim().length};
    });
    await page.screenshot({path:path.join(OUTPUT,`${locale}-mobile-no-js.png`),fullPage:false});
    const check={locale,status:response?.status()||null,...state}; checks.push(check);
    const bad=state.opening.some(x=>!x.exists||!Number.isFinite(x.opacity)||x.opacity<.99||x.transform!=="none");
    if(!response?.ok()||bad||state.menuToggleDisplay!=="none"||state.languagesDisplay==="none"||state.scrollWidth>state.clientWidth+1||state.mainTextLength<500) recordFailure(scope,"No-JavaScript fallback is incomplete",check);
    await context.close();
  }
  results.push({scope,checks});
}

/* === Release polish gate === */
{
  const scope="release/polish",checks=[];
  for(const locale of locales){
    const context=await browser.newContext({viewport:{width:1440,height:900}}),page=await context.newPage();
    await page.goto(`${ORIGIN}/${locale}/`,{waitUntil:"networkidle",timeout:30000});
    const state=await page.evaluate(()=>{const icon=document.querySelector('link[rel~="icon"]'),cv=document.querySelector('.identity__actions a[download][href$=".pdf"]');return{favicon:icon?.href||null,quietDownloads:[...document.querySelectorAll('a[download].text-link--quiet')].map(a=>a.getAttribute('href')),identityCvExists:Boolean(cv),identityCvOpacity:cv?Number(getComputedStyle(cv).opacity):null,twitterCard:document.querySelector('meta[name="twitter:card"]')?.content||null}});
    let fr=null;if(state.favicon){const r=await page.request.get(state.favicon),body=await r.body();fr={status:r.status(),ok:r.ok(),contentType:r.headers()["content-type"]||"",bytes:body.length}}
    const check={locale,...state,faviconResponse:fr};checks.push(check);
    if(!state.favicon||!fr?.ok||!fr.contentType.includes('image/svg+xml')||fr.bytes<100||state.quietDownloads.length||!state.identityCvExists||state.identityCvOpacity<.99||state.twitterCard!=="summary_large_image") recordFailure(scope,"Release polish regression",check);
    await context.close();
  }
  results.push({scope,checks});
}

'''
          if marker not in s: raise SystemExit('CV gate marker missing')
          q.write_text(s.replace(marker,block+marker,1))
          PY
      - name: Regenerate and verify CVs
        run: |
          python scripts/build_cv.py
          for f in assets/cv/*.pdf; do test "$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')" = "1"; pdftotext "$f" - | grep -q "ANDRII MAKUKHA"; done
      - name: Commit polished release candidate
        run: |
          rm .github/workflows/one-off-final-release-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply final portfolio release polish"
          git push origin HEAD:portfolio-v2
