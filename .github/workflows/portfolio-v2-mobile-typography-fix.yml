name: Portfolio v2 Mobile Typography Fix

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - .github/workflows/portfolio-v2-mobile-typography-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-v2
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2
      - name: Apply compact-view editorial typography fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/v2.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Compact-view whole-word typography */'
          if marker in css:
              print('Typography fix already present; no change needed.')
              raise SystemExit(0)

          patch = "\n\n/* Compact-view whole-word typography */\n@media (max-width: 560px) {\n  .profile__display,\n  .foundation__display,\n  .capabilities__display,\n  .ai__display,\n  .work__display,\n  .journey__display,\n  .languages__display,\n  .workflow-step h3,\n  .capability-row__evidence strong,\n  .capability-row__result h3,\n  .work-case__story h3,\n  .symbioz-grid__story h3,\n  .case-study__title,\n  .journey-event__content h3,\n  .digital-card h4,\n  .journey-education > h3 {\n    overflow-wrap: normal;\n    word-break: normal;\n    hyphens: none;\n  }\n\n  html[lang=\"de\"] .languages__display,\n  html[lang=\"en\"] .languages__display {\n    font-size: clamp(1.95rem, 9vw, 3.6rem);\n  }\n\n  html[lang=\"ru\"] .capabilities__display,\n  html[lang=\"ru\"] .work__display,\n  html[lang=\"ru\"] .languages__display {\n    font-size: clamp(1.85rem, 9vw, 3.5rem);\n  }\n}\n"
          path.write_text(css + patch, encoding='utf-8')
          PY
      - name: Commit typography fix
        shell: bash
        run: |
          if git diff --quiet -- css/v2.css; then
            echo "No CSS change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v2.css
          git commit -m "Fix mobile editorial word breaks"
          git push origin HEAD:portfolio-v2
