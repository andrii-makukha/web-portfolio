name: Portfolio v2 Browser QA

# Permanent Chromium regression gate for responsive, accessibility, multilingual text flow,
# legal completeness, footer composition and search-indexing prerequisites.
on:
  push:
    branches:
      - portfolio-v2
      - portfolio-v2.1-responsive-hardening
      - portfolio-v2.2-text-flow-stress
      - portfolio-v2.3-cross-browser-stress
      - portfolio-v2.4-lighthouse-final-audit
      - portfolio-v2.5-final-polish
      - portfolio-v2.5.1-header-compact-fix
      - portfolio-v2.5.2-smooth-header-collapse
      - portfolio-v2.6-legal-404-search
      - portfolio-v2.7-vercel-seo
      - portfolio-v2.8-final-audit
      - main
    paths:
      - "README.md"
      - "index.html"
      - "404.html"
      - "vercel.json"
      - "robots.txt"
      - "sitemap.xml"
      - "de/**"
      - "en/**"
      - "ru/**"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "qa/**"
      - "scripts/build_cv.py"
      - "scripts/build_cv_v3.py"
      - ".github/workflows/build-cv.yml"
      - ".github/workflows/portfolio-v2-qa.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-v2-browser-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate QA syntax
        run: |
          node --check qa/browser-qa.mjs
          node --check qa/mobile-typography-qa.mjs
          node --check qa/text-flow-stress-qa.mjs
          node --check qa/header-compact-regression.mjs
          node --check qa/footer-layout-qa.mjs
          node --check qa/legal-completeness-qa.mjs
          node --check qa/vercel-production-qa.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-v2-server.log 2>&1 &
          echo $! > /tmp/portfolio-v2-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/de/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-v2-server.log
          exit 1

      - name: Run browser QA
        run: node qa/browser-qa.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173

      - name: Run compact Header regression QA
        run: node qa/header-compact-regression.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_BROWSER: chromium

      - name: Run mobile typography regression QA
        if: always()
        run: node qa/mobile-typography-qa.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173

      - name: Run text-flow stress QA
        if: always()
        run: node qa/text-flow-stress-qa.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173

      - name: Run footer layout QA
        if: always()
        run: node qa/footer-layout-qa.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173

      - name: Run legal and search readiness QA
        if: always()
        run: node qa/legal-completeness-qa.mjs

      - name: Run Vercel production metadata QA
        if: always()
        run: node qa/vercel-production-qa.mjs

      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-browser-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
