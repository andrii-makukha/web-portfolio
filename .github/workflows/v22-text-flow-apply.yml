name: Apply v2.2 Text Flow Patch

on:
  push:
    branches:
      - portfolio-v2.2-text-flow-stress
    paths:
      - ".github/workflows/v22-text-flow-apply.yml"
      - "scripts/v22_text_flow_patch.py"
      - "scripts/v22_text_flow_patch2.py"
      - "scripts/v22_text_flow_patch3.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2.2-text-flow-stress
      - name: Apply measured correction patch
        run: python3 scripts/v22_text_flow_patch3.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v2.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix: resolve remaining text-flow failures"
          git push origin HEAD:portfolio-v2.2-text-flow-stress
