name: Portfolio v2 Mobile Typography Refine

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - .github/workflows/portfolio-v2-mobile-typography-refine.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-v2
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2
      - name: Refine compact typography scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/v2.css')
          css = path.read_text(encoding='utf-8')
          old = """  .profile__display,\n  .foundation__display,\n  .capabilities__display,\n  .ai__display,\n  .work__display,\n  .journey__display,\n  .languages__display,\n  .workflow-step h3,\n  .capability-row__evidence strong,\n  .capability-row__result h3,\n  .work-case__story h3,\n  .symbioz-grid__story h3,\n  .case-study__title,\n  .journey-event__content h3,\n  .digital-card h4,\n  .journey-education > h3 {\n"""
          new = """  .profile__display,\n  .foundation__display,\n  .capabilities__display,\n  .ai__display,\n  .work__display,\n  .journey__display,\n  .languages__display {\n"""
          if old not in css:
              raise SystemExit('Expected compact typography selector block was not found.')
          path.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit refined typography scope
        shell: bash
        run: |
          if git diff --quiet -- css/v2.css; then
            echo "No CSS change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/v2.css
          git commit -m "Refine mobile whole-word typography scope"
          git push origin HEAD:portfolio-v2
