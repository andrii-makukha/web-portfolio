name: Portfolio v2 Lighthouse Final Audit

on:
  push:
    branches:
      - portfolio-v2.4-lighthouse-final-audit
    paths:
      - "de/**"
      - "en/**"
      - "ru/**"
      - "css/**"
      - "js/**"
      - "assets/**"
      - ".github/workflows/portfolio-v2-lighthouse-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: ${{ matrix.strategy }} / ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        strategy: [mobile, desktop]
        locale: [de, en, ru]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          LH_VERSION="$(npm view lighthouse version)"
          echo "LIGHTHOUSE_VERSION=$LH_VERSION" >> "$GITHUB_ENV"
          npm install --global "lighthouse@$LH_VERSION"
          lighthouse --version
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Start local production server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:4173/${{ matrix.locale }}/" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Run Lighthouse three times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "lighthouse/${{ matrix.strategy }}/${{ matrix.locale }}"
          URL="http://127.0.0.1:4173/${{ matrix.locale }}/"
          PRESET=()
          if [ "${{ matrix.strategy }}" = "desktop" ]; then
            PRESET=(--preset=desktop)
          fi

          for run in 1 2 3; do
            lighthouse "$URL" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              "${PRESET[@]}" \
              --output=json \
              --output=html \
              --output-path="lighthouse/${{ matrix.strategy }}/${{ matrix.locale }}/run-$run"
          done

      - name: Build median summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, statistics, os

          strategy = "${{ matrix.strategy }}"
          locale = "${{ matrix.locale }}"
          root = pathlib.Path("lighthouse") / strategy / locale
          rows = []
          metrics = []

          for idx in (1, 2, 3):
              data = json.loads((root / f"run-{idx}.report.json").read_text())
              cats = data["categories"]
              audits = data["audits"]
              row = {
                  "run": idx,
                  "performance": round(cats["performance"]["score"] * 100),
                  "accessibility": round(cats["accessibility"]["score"] * 100),
                  "best_practices": round(cats["best-practices"]["score"] * 100),
                  "seo": round(cats["seo"]["score"] * 100),
                  "fcp_ms": round(audits["first-contentful-paint"]["numericValue"]),
                  "lcp_ms": round(audits["largest-contentful-paint"]["numericValue"]),
                  "tbt_ms": round(audits["total-blocking-time"]["numericValue"]),
                  "cls": round(audits["cumulative-layout-shift"]["numericValue"], 3),
                  "speed_index_ms": round(audits["speed-index"]["numericValue"]),
              }
              rows.append(row)

          keys = ["performance", "accessibility", "best_practices", "seo", "fcp_ms", "lcp_ms", "tbt_ms", "cls", "speed_index_ms"]
          median = {key: statistics.median(row[key] for row in rows) for key in keys}
          summary = {
              "strategy": strategy,
              "locale": locale,
              "lighthouse_version": os.environ.get("LIGHTHOUSE_VERSION"),
              "runs": rows,
              "median": median,
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")

          md = [
              f"### Lighthouse — {strategy} / {locale.upper()}",
              "",
              f"Lighthouse `{summary['lighthouse_version']}` · median of 3 runs",
              "",
              "| Metric | Median |",
              "| --- | ---: |",
              f"| Performance | {median['performance']:.0f} |",
              f"| Accessibility | {median['accessibility']:.0f} |",
              f"| Best Practices | {median['best_practices']:.0f} |",
              f"| SEO | {median['seo']:.0f} |",
              f"| FCP | {median['fcp_ms']:.0f} ms |",
              f"| LCP | {median['lcp_ms']:.0f} ms |",
              f"| TBT | {median['tbt_ms']:.0f} ms |",
              f"| CLS | {median['cls']:.3f} |",
              f"| Speed Index | {median['speed_index_ms']:.0f} ms |",
              "",
          ]
          text = "\n".join(md)
          (root / "summary.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(text)
          PY

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.strategy }}-${{ matrix.locale }}
          path: lighthouse/${{ matrix.strategy }}/${{ matrix.locale }}/
          retention-days: 14
