name: Portfolio v2 Multilingual Copy Polish

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - .github/workflows/portfolio-v2-copy-polish.yml

permissions:
  contents: write

jobs:
  apply-copy-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-v2
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2
      - name: Polish Symbioz case-study copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'de/index.html': (
                  'Als Gründer und Leiter der Symbioz Band verantwortete ich ein Team aus acht Musikern und die Organisation der Band. Dazu gehörten die Organisation von mehr als 80 Veranstaltungen, Projektplanung, Budgetverantwortung, Kundenakquise, Konfliktmanagement und Qualitätssicherung.',
                  'Als Gründer und Leiter der Symbioz Band führte ich ein Team aus acht Musikern und verantwortete die organisatorische Leitung. Dazu gehörten die Planung und Durchführung von mehr als 80 Veranstaltungen, Budgetverantwortung, Kundenakquise, Konfliktmanagement und Qualitätssicherung.'
              ),
              'en/index.html': (
                  'As founder and leader of Symbioz Band, I was responsible for an eight-person team and the organisation of the band. This included managing more than 80 events, project planning, budget responsibility, client acquisition, conflict management and quality assurance.',
                  "As founder and leader of Symbioz Band, I led an eight-person team and was responsible for the band's operations. My work included planning and delivering more than 80 events, managing budgets, client acquisition, conflict management and quality assurance."
              ),
              'ru/index.html': (
                  'Как основатель и руководитель Symbioz Band я отвечал за команду из восьми музыкантов и организацию группы. В мои обязанности входили организация более 80 мероприятий, проектное планирование, бюджет, привлечение клиентов, решение конфликтов и контроль качества.',
                  'Как основатель и руководитель Symbioz Band я управлял командой из восьми музыкантов и отвечал за организационную работу группы. В мои задачи входили подготовка и проведение более 80 мероприятий, бюджет, привлечение клиентов, решение конфликтов и контроль качества.'
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected copy not found in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit copy polish
        shell: bash
        run: |
          if git diff --quiet -- de/index.html en/index.html ru/index.html; then
            echo "No copy changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/index.html en/index.html ru/index.html
          git commit -m "Polish multilingual Symbioz case-study copy"
          git push origin HEAD:portfolio-v2
