name: Portfolio v2.8 Copy Maintenance

on:
  push:
    branches:
      - portfolio-v2.8-final-audit
    paths:
      - ".github/workflows/portfolio-v2.8-copy-maintenance.yml"

permissions:
  contents: write

jobs:
  polish-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2.8-final-audit
          fetch-depth: 0

      - name: Apply copy refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = {
              'de/index.html': [
                  (
                      'Budgetverantwortung und Kundenakquise brachten wirtschaftliche und kommunikative Verantwortung in die fachliche Arbeit.',
                      'Budgetverantwortung und Kundenakquise erforderten wirtschaftliches Denken und klare Kommunikation.',
                  ),
                  (
                      'Durch die Full-Stack-JavaScript-Weiterbildung und KI-gestütztes Lernen habe ich mir bewusst ein neues technisches Arbeitsfeld erschlossen.',
                      'Durch die Full-Stack-JavaScript-Weiterbildung und die Arbeit mit KI-Werkzeugen habe ich meine digitalen Kompetenzen gezielt erweitert.',
                  ),
              ],
              'en/index.html': [
                  (
                      'Managing budgets and acquiring clients added commercial and communication responsibilities to the work.',
                      'Managing budgets and acquiring clients required commercial awareness and clear communication.',
                  ),
                  (
                      'The Full-Stack JavaScript programme and AI-assisted learning reflect a deliberate expansion into a new technical field.',
                      'The Full-Stack JavaScript programme and practical work with AI tools helped me deliberately expand my digital capabilities.',
                  ),
              ],
              'ru/index.html': [
                  (
                      'Обучение Full-Stack JavaScript и работа с ИИ-инструментами показывают осознанное освоение нового технического направления.',
                      'Обучение Full-Stack JavaScript и практическая работа с ИИ-инструментами помогли мне целенаправленно расширить цифровые навыки.',
                  ),
              ],
          }

          changed = []
          for filename, replacements in patches.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in replacements:
                  if old not in text:
                      if new in text:
                          continue
                      raise SystemExit(f'Expected copy not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Verify content contract
        run: node qa/content-parity-qa.mjs

      - name: Commit copy refinements
        run: |
          if git diff --quiet -- de/index.html en/index.html ru/index.html; then
            echo "No copy changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add de/index.html en/index.html ru/index.html
          git commit -m "Polish multilingual capability copy"
          git push origin HEAD:portfolio-v2.8-final-audit
