name: Portfolio v2 Cross-Browser QA

# Permanent cross-browser release gate.
# WebKit is the strict Safari-like typography gate; Firefox remains a full runtime,
# interaction, sticky/resize and user-scrollable horizontal-overflow gate.
on:
  push:
    branches:
      - portfolio-v2.3-cross-browser-stress
      - portfolio-v2.4-lighthouse-final-audit
      - portfolio-v2.5-final-polish
      - portfolio-v2.5.1-header-compact-fix
      - portfolio-v2.5.2-smooth-header-collapse
      - portfolio-v2.6-legal-404-search
      - portfolio-v2.7-vercel-seo
      - portfolio-v2.8-final-audit
      - main
    paths:
      - "README.md"
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "de/**"
      - "en/**"
      - "ru/**"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "qa/**"
      - ".github/workflows/portfolio-v2-cross-browser-qa.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-v2-cross-browser-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-browser:
    name: ${{ matrix.browser }} stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate QA syntax
        run: |
          node --check qa/cross-browser-v2.mjs
          node --check qa/header-compact-regression.mjs
          node --check qa/footer-layout-qa.mjs
          node --check qa/content-parity-qa.mjs
          node --check qa/legal-completeness-qa.mjs
          node --check qa/vercel-production-qa.mjs

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-cross-browser-server.log 2>&1 &
          echo $! > /tmp/portfolio-cross-browser-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/de/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-cross-browser-server.log
          exit 1

      - name: Run multilingual content parity QA
        run: node qa/content-parity-qa.mjs

      - name: Run legal and search readiness QA
        run: node qa/legal-completeness-qa.mjs

      - name: Run Vercel production metadata QA
        run: node qa/vercel-production-qa.mjs

      - name: Run cross-browser stress QA
        run: node qa/cross-browser-v2.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_BROWSER: ${{ matrix.browser }}

      - name: Run footer layout QA
        run: node qa/footer-layout-qa.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_BROWSER: ${{ matrix.browser }}

      - name: Run compact Header regression QA
        run: node qa/header-compact-regression.mjs
        env:
          QA_ORIGIN: http://127.0.0.1:4173
          QA_BROWSER: ${{ matrix.browser }}

      - name: Upload cross-browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-v2-cross-browser-${{ matrix.browser }}
          path: |
            qa-output/cross-browser/${{ matrix.browser }}/
            qa-output/footer-layout/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
