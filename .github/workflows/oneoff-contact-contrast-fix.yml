name: One-off contact contrast fix

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - ".github/workflows/oneoff-contact-contrast-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2
          fetch-depth: 0

      - name: Patch static CSS contrast
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("css/v2.css")
          text = path.read_text()
          old = ".contact__cv strong {\n  color: rgba(250,248,243,.38);\n}"
          new = ".contact__cv strong {\n  color: rgba(250,248,243,.68);\n}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one contact contrast rule, found {count}")
          path.write_text(text.replace(old, new))
          PY

      - name: Commit static CSS fix
        shell: bash
        run: |
          git config user.name "portfolio-v2-qa"
          git config user.email "actions@users.noreply.github.com"
          git add css/v2.css
          git diff --cached --check
          git commit -m "Fix contact CV status contrast"
          git push origin HEAD:portfolio-v2
