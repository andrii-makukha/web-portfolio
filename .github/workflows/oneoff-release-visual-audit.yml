name: One-off release visual audit

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - ".github/workflows/oneoff-release-visual-audit.yml"

permissions:
  contents: write

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/portfolio-release-server.log 2>&1 &
          echo $! >/tmp/portfolio-release-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/de/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/portfolio-release-server.log
          exit 1

      - name: Capture social preview and external project reviews
        shell: bash
        run: |
          mkdir -p release-review assets
          cat > /tmp/release-visual-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });

          const local = await browser.newPage({ viewport: { width: 1200, height: 630 }, deviceScaleFactor: 1 });
          await local.goto('http://127.0.0.1:4173/de/', { waitUntil: 'networkidle', timeout: 30000 });
          await local.evaluate(() => window.scrollTo(0, 0));
          await local.waitForTimeout(250);
          await local.screenshot({ path: 'assets/og-portfolio.png', fullPage: false });
          await local.close();

          const external = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const targets = [
            ['aurum', 'https://aurum-clean.vercel.app/de/site'],
            ['automobilanwendung', 'https://automobilanwendung.vercel.app/contact']
          ];
          const report = [];
          for (const [name, url] of targets) {
            try {
              const response = await external.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
              await external.waitForTimeout(500);
              await external.screenshot({ path: `release-review/${name}.png`, fullPage: false });
              report.push({ name, url, status: response?.status() ?? null, title: await external.title(), finalUrl: external.url() });
            } catch (error) {
              report.push({ name, url, error: String(error) });
            }
          }
          await external.close();
          await browser.close();
          await import('node:fs').then(fs => fs.writeFileSync('release-review/report.json', JSON.stringify(report, null, 2)));
          JS
          node /tmp/release-visual-audit.mjs

      - name: Add social-preview metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          image = 'https://andrii-makukha.github.io/web-portfolio/assets/og-portfolio.png'
          alts = {
              'de': 'Andrii Makukha — Persönliches Portfolio',
              'en': 'Andrii Makukha — Professional Portfolio',
              'ru': 'Andrii Makukha — Профессиональное портфолио',
          }
          for locale, alt in alts.items():
              path = Path(locale) / 'index.html'
              text = path.read_text()
              if 'property="og:image"' in text:
                  continue
              marker = '  <meta property="og:site_name" content="Andrii Makukha">\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'OG marker mismatch in {path}')
              block = (
                  marker
                  + f'  <meta property="og:image" content="{image}">\n'
                  + '  <meta property="og:image:width" content="1200">\n'
                  + '  <meta property="og:image:height" content="630">\n'
                  + f'  <meta property="og:image:alt" content="{alt}">\n'
                  + f'  <meta name="twitter:image" content="{image}">\n'
                  + f'  <meta name="twitter:image:alt" content="{alt}">\n'
              )
              path.write_text(text.replace(marker, block))
          PY

      - name: Commit social preview
        shell: bash
        run: |
          git config user.name "portfolio-v2-release"
          git config user.email "actions@users.noreply.github.com"
          git add assets/og-portfolio.png de/index.html en/index.html ru/index.html
          git diff --cached --check
          git commit -m "Add portfolio social preview metadata"
          git push origin HEAD:portfolio-v2

      - uses: actions/upload-artifact@v4
        with:
          name: release-visual-review
          path: release-review/
          retention-days: 14
