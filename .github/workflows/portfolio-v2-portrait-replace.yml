name: Portfolio v2 Portrait Replace

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - .github/workflows/portfolio-v2-portrait-replace.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio-v2
        uses: actions/checkout@v4
        with:
          ref: portfolio-v2

      - name: Integrate selected portrait
        shell: bash
        run: |
          base64 --decode assets/portrait-upload.b64 > assets/portrait.webp
          test -s assets/portrait.webp
          sed -i 's/width="720" height="1080" loading="lazy"/width="800" height="1000" loading="lazy"/g' de/index.html en/index.html ru/index.html
          sed -i 's/object-position: center 30%/object-position: center 31%/' css/v2.css
          sed -i 's/filter: saturate(.8) contrast(1.03)/filter: saturate(.78) brightness(.86) contrast(1.05)/' css/v2.css
          rm -f assets/portrait-upload.b64
          rm -f assets/portrait-new-placeholder.txt
          rm -f docs/PHOTO_ASSET_STATUS.md
          rm -f .github/workflows/portfolio-v2-portrait-replace.yml

      - name: Commit portrait integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate new studio portrait"
          git push origin HEAD:portfolio-v2
