name: Portfolio v2 Portrait Replace

on:
  push:
    branches:
      - portfolio-v2
    paths:
      - .github/workflows/portfolio-v2-portrait-replace.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-v2

      - name: Decode selected portrait asset
        run: |
          base64 --decode assets/portrait-upload.b64 > assets/portrait.webp
          test -s assets/portrait.webp

      - name: Update portrait metadata and presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('de/index.html', 'en/index.html', 'ru/index.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'width="720" height="1080" loading="lazy"',
                  'width="800" height="1000" loading="lazy"'
              )
              p.write_text(s, encoding='utf-8')

          p = Path('css/v2.css')
          s = p.read_text(encoding='utf-8')
          old = '''object-position: center 30%;
  display: block;
  filter: saturate(.8) contrast(1.03);'''
          new = '''object-position: center 31%;
  display: block;
  filter: saturate(.78) brightness(.86) contrast(1.05);'''
          if old not in s:
              raise SystemExit('Expected portrait styling block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove staging files
        run: |
          rm -f assets/portrait-upload.b64
          rm -f assets/portrait-new-placeholder.txt
          rm -f docs/PHOTO_ASSET_STATUS.md
          rm -f .github/workflows/portfolio-v2-portrait-replace.yml

      - name: Commit portrait integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate new studio portrait"
          git push origin HEAD:portfolio-v2
